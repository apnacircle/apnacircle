name: apnacircle
description: "ApnaCircle - family location safety app. Live location, SIM-call caller distance, SOS, parent-PIN locks. Family plan 5 USD/year, parent pays only."
publish_to: "none"
version: 0.6.21+27

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# Android support: minSdk 24 = Android 7.0 (Nougat). Raised from 21 on
# 22 Nov 2026 — Flutter 3.35's Gradle plugin FAILS the build when minSdk
# is below 23 (and warns below 24), so Android 5.0/6.0 are no longer
# supported. Target is Play Store current target (35 in this release).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # intl 0.20.2: Flutter >= 3.32 pins flutter_localizations to intl 0.20.2,
  # so ^0.19.0 fails version solving on Flutter 3.35 (build #1 latent bug).
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  battery_plus: ^6.0.3
  sensors_plus: ^4.0.2
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  # v0.3 (22 Nov 2026): Firebase — cross-phone admin/child sync.
  # Auth (email + phone OTP), Realtime Database (live location,
  # locks, alerts, chat), Cloud Messaging (SOS push). The app still
  # runs WITHOUT a Firebase project (demo mode): main.dart catches
  # a failed Firebase.initializeApp() and falls back to local
  # SharedPreferences. google-services.json is gitignored and is
  # injected at build time when the console project exists.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  # v0.6: 6-digit email OTP login — calls the requestEmailCode /
  # verifyEmailCode Cloud Functions (functions/index.js). The code
  # itself is never in the app; verify returns a custom token and
  # the app signs in with it (signInWithCustomToken).
  cloud_functions: ^5.1.3
  # v0.3 offline fallback: detect "no data" so the app knows when to
  # fall back to SMS location sharing (GPS + SMS need no data).
  connectivity_plus: ^6.1.0
  in_app_purchase: ^3.2.3
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^20.1.0
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_webrtc: ^1.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
