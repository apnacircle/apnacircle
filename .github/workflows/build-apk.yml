# ApnaCircle — build release APK on GitHub Actions (free runner).
# No account/card needed to add this file. To use it:
#   1. Create a free GitHub repo (github.com/new) — no card needed.
#   2. Push this project: git init && git add . && git commit -m "ApnaCircle" && git remote add origin <repo-url> && git push -u origin main
#   3. GitHub tab "Actions" -> "Build ApnaCircle APK" -> Run workflow (or it runs on every push).
#   4. Download the APK from the run's "Artifacts" (apnacircle-apk), valid 90 days.
# NOTE: release APK here is unsigned/debug-signed by Flutter; for Play Store
# use `flutter build appbundle --release` with a real keystore (see README).
name: Build ApnaCircle APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # NOTE (22 Nov 2026, build #1 failed): pin ONLY the version — do NOT
      # add `channel: stable` here. Run #1 pinned 3.24.5 but the runner
      # installed 3.35.7, and geolocator_android 4.6.2's legacy
      # `flutter.compileSdkVersion` only resolves on Flutter >= 3.35, whose
      # Gradle plugin creates the `flutter` extension on plugin projects
      # (Flutter 3.24 only creates it on :app). 3.35.7 is the version the
      # runner actually used, so pin it explicitly.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
      # Firebase (v0.3, 22 Nov 2026): google-services.json is gitignored,
      # so the runner gets it from the GOOGLE_SERVICES_JSON repo secret
      # (Settings > Secrets and variables > Actions). Without it the app
      # still builds (the google-services plugin applies only when the
      # file exists) but runs in local demo mode with no cross-phone sync.
      # NOTE: the `secrets` context CANNOT be used in a step `if:`
      # (runs #30-41 failed validation: "Unrecognized named-value:
      # 'secrets'"), so the check is done in shell instead.
      # NOTE 2 (run #42 failed): the secret JSON contains double quotes,
      # so interpolating it inside double quotes in `run:` breaks the
      # shell and mangles the file (MalformedJsonException at
      # $.project_info.firebase_url). Pass it via `env:` instead — the
      # value then reaches printf untouched.
      - name: Restore google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
      - name: Install dependencies
        run: flutter pub get
      # v0.6.25 (27 Nov 2026): the media packages need compileSdk
      # 36 (CI run #376 failed at checkReleaseAarMetadata on 35),
      # so install the android-36 platform + build-tools 36
      # explicitly — the runner image is not guaranteed to have
      # them. ANDROID_HOME is set by the runner image.
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apnacircle-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
