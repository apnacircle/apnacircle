plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.apnacircle.app"
    // Play Store current target is 35 in this release (raised from 34 on
    // 22 Nov 2026): flutter_plugin_android_lifecycle requires SDK 35+.
    // compileSdk 35 (not 36): Android SDK platform 35 is guaranteed on the
    // GitHub runner; plugins that need 36 (geolocator_android via
    // flutter.compileSdkVersion on Flutter 3.35) only log a warning.
    compileSdk = 35
    // NDK 27.0.12077973 = AGP 8.9.1 default (was 26.3.11579264 for AGP 8.3.2).
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.apnacircle.app"
        // minSdk 24 = Android 7.0 (raised from 21 on 22 Nov 2026).
        // Flutter 3.35's Gradle plugin FAILS the build when minSdk < 23
        // and warns below 24, so Android 5.0/6.0 are no longer supported.
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "0.1.0"
        // Google Maps key comes from gradle.properties / local.properties
        // (MAPS_API_KEY). Default is the placeholder — the map will not
        // load until a real key is set on the build machine. The key is
        // never hard-coded in source or committed to git.
        manifestPlaceholders = [
            MAPS_API_KEY: project.hasProperty("MAPS_API_KEY")
                ? project.property("MAPS_API_KEY")
                : "YOUR_GOOGLE_MAPS_API_KEY"
        ]
    }

    signingConfigs {
        // Release signing is configured on the build machine:
        // create a keystore with keytool, put its path/passwords in
        // android/key.properties (NEVER commit it). See README.
        release {
            keyAlias = "apnacircle"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Keep in step with the Kotlin plugin version in settings.gradle (2.1.0).
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
}
