org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true -Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
# Google Maps API key — PLACEHOLDER, not a real key.
# Build machine par: apni real key yahan likhein, ya local.properties
# mein MAPS_API_KEY=... likhein. Key ko Google Cloud mein sirf is app
# (com.apnacircle.app) + Maps SDK for Android par restrict karein.
# Real key kabhi git mein commit NA karein.
MAPS_API_KEY=YOUR_GOOGLE_MAPS_API_KEY
